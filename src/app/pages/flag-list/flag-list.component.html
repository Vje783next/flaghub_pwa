<header class="header">
  <img class="header__logo" src="logo.png" alt="logo de Flag Hub">
  <h1 class="header__title">Flag Hub</h1>
  <div>
    <button class="header__btn" (click)="tabla()"><mat-icon>view_list</mat-icon></button>
    <button class="header__btn" (click)="cards()"><mat-icon>grid_view</mat-icon></button>
  </div>
</header>

@if (loadingFlags) {
<div class="spinner-container">
  <mat-spinner></mat-spinner>
</div>
}

@if(showTabla && !loadingFlags) {
<section class="table">
  <app-grid 
    [flags]="flags()"
  ></app-grid>
</section>
}

@if(showCards && !loadingFlags) {
<section class="cards" [@flagsAnimation]>
  @for (flag of flags(); track flag.cca3) {
  <app-card 
    [name]="flag.name.official" 
    [flag]="flag.flags.png" 
    [cca3]="flag.cca3"
  >
  </app-card>
  }
</section>
}
