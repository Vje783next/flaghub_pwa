<mat-card class="card" appearance="outlined">
  <mat-card-header class="card__header">
    <mat-card-title class="card__title">{{name}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <img mat-card-image class="card__image" [src]="flag" [alt]="name" loading="lazy">
  </mat-card-content>
  <mat-card-actions>
    <button mat-button [routerLink]="['/flags', cca3]" class="card__btn">See more details</button>
  </mat-card-actions>
</mat-card>
